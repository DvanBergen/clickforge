[workspace]
members = ["crates/clickforge_sdk", "."]
resolver = "2"

[package]
name = "clickforge"
version = "0.1.0"
edition = "2024"
description = "Linux-native automated input workbench with visual blocks and isolated Rust scripting"

[dependencies]
clickforge_sdk = { path = "crates/clickforge_sdk" }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
egui = "0.37.0"
evdev = { version = "0.13.2", features = ["serde"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
rand = "0.10.4"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
overflow-checks = true
